<head>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f8fc;
      color: #172033;
    }
    header {
      background: #073b66;
      color: white;
      padding: 22px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    header a { color: white; text-decoration: none; }
    .brand { font-size: 24px; font-weight: bold; }
    nav { display: flex; gap: 20px; flex-wrap: wrap; }
    .hero {
      padding: 38px 6%;
      background: #e2f3ff;
      text-align: center;
    }
    .hero h1 { margin: 0 0 10px; font-size: 32px; }
    .hero p { margin: 0; color: #40536b; }
    .container { max-width: 1200px; margin: auto; padding: 30px 18px 50px; }
    .count { margin-bottom: 22px; color: #526174; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 22px;
    }
    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(18, 48, 80, .09);
      display: flex;
      flex-direction: column;
    }
    .product-image {
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: #fff;
      padding: 14px;
    }
    .card-content { padding: 18px; display: flex; flex-direction: column; flex: 1; }
    .card h2 { font-size: 19px; margin: 0 0 10px; }
    .description { color: #657186; line-height: 1.5; flex: 1; margin: 0 0 14px; }
    .price { color: #087443; font-size: 22px; font-weight: bold; margin-bottom: 16px; }
    .button {
      display: block;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      background: #0878c9;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    .button:hover { background: #055c9b; }
    footer { text-align: center; padding: 22px; background: #073b66; color: white; }
  </style>
</head>
<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P34CFP6D"
      height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>
  <!-- End Google Tag Manager (noscript) -->

  <header>
    <a class="brand" href="index.html">PureWater</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="water-filters.html">All Products</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>All Water Filters</h1>
    <p>Explore our demo collection and find the right water filter for your needs.</p>
  </section>

  <main class="container">
    <p class="count">Showing <strong id="product-count">10</strong> products</p>
    <div class="products" id="products"></div>
  </main>

  <footer>PureWater Demo Store · For learning and tracking practice</footer>

  <script>
    window.dataLayer = window.dataLayer || [];

    const products = [
      {
        id: "best-overall",
        name: "Best Overall Filter",
        price: 4999,
        description: "A versatile water filter for everyday home use.",
        image: "https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=700&q=80",
        imageAlt: "Water bottle representing the Best Overall Filter"
      },
      {
        id: "budget-friendly",
        name: "Budget Friendly Filter",
        price: 2499,
        description: "An affordable option for everyday water filtration.",
        image: "https://images.unsplash.com/photo-1523362628745-0c100150b1c8?auto=format&fit=crop&w=700&q=80",
        imageAlt: "Water bottle representing the Budget Friendly Filter"
      },
      {
        id: "compact",
        name: "Compact Water Filter",
        price: 3299,
        description: "A compact option for smaller spaces.",
        image: "https://images.unsplash.com/photo-1548839140-29a749e1cf4d?auto=format&fit=crop&w=700&q=80",
        imageAlt: "Fresh drinking water representing the Compact Water Filter"
      },
      {
        id: "ro",
        name: "PureWater RO Filter",
        price: 8999,
        description: "A reverse osmosis model for your demo collection.",
        image: "https://images.unsplash.com/photo-1564419320461-6870880221ad?auto=format&fit=crop&w=700&q=80",
        imageAlt: "Water filtration product image for the RO Filter"
      },
      {
        id: "uv",
        name: "PureWater UV Filter",
        price: 5499,
        description: "A UV filtration model for everyday home use.",
        image: "https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&w=700&q=80",
        imageAlt: "Clean water themed image for the UV Filter"
      },
      {
        id: "uf",
        name: "PureWater UF Filter",
        price: 3499,
        description: "A simple UF model in the PureWater demo range.",
        image: "https://images.unsplash.com/photo-1532634896-26909d0d4b8a?auto=format&fit=crop&w=700&q=80",
        imageAlt: "Water-themed image for the UF Filter"
      },
      {
        id: "alkaline",
        name: "PureWater Alkaline Filter",
        price: 6499,
        description: "An alkaline filter option in our demo collection.",
        image: "https://images.unsplash.com/photo-1513558161293-cdaf765edfd7?auto=format&fit=crop&w=700&q=80",
        imageAlt: "Fresh beverage and water image for the Alkaline Filter"
      },
      {
        id: "copper",
        name: "PureWater Copper Filter",
        price: 4499,
        description: "A copper-themed option for this demo store.",
        image: "https://images.unsplash.com/photo-1536935338788846bb9981813?auto=format&fit=crop&w=700&q=80",
        imageAlt: "Copper-toned product themed image"
      },
      {
        id: "portable",
        name: "PureWater Portable Filter",
        price: 1499,
        description: "A portable water option for travel and everyday use.",
        image: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80",
        imageAlt: "Outdoor image representing portable water use"
      },
      {
        id: "premium-ro",
        name: "PureWater Premium RO",
        price: 10999,
        description: "A premium option in the PureWater demo collection.",
        image: "https://images.unsplash.com/photo-1606112219348-204d7d8b94ee?auto=format&fit=crop&w=700&q=80",
        imageAlt: "Premium themed product image"
      }
    ];

    const formatPrice = price =>
      "₹" + price.toLocaleString("en-IN");

    document.getElementById("product-count").textContent = products.length;

    document.getElementById("products").innerHTML = products.map((product, index) => `
      <article class="card">
        <img
          class="product-image"
          src="${product.image}"
          alt="${product.imageAlt}"
          loading="${index < 3 ? "eager" : "lazy"}"
          onerror="this.onerror=null;this.src='https://placehold.co/600x400/eaf4fb/173b5e?text=PureWater+Product';"
        >
        <div class="card-content">
          <h2>${product.name}</h2>
          <p class="description">${product.description}</p>
          <div class="price">${formatPrice(product.price)}</div>
          <a
            class="button"
            href="product-details.html?product=${encodeURIComponent(product.id)}"
            data-event="select_item"
            data-product-id="${product.id}"
            data-product-name="${product.name}"
            data-product-price="${product.price}"
          >View Details</a>
        </div>
      </article>
    `).join("");

    window.dataLayer.push({
      event: "view_item_list",
      ecommerce: {
        item_list_name: "All Water Filters",
        items: products.map((product, index) => ({
          item_id: product.id,
          item_name: product.name,
          price: product.price,
          index: index + 1
        }))
      }
    });

    document.querySelectorAll('[data-event="select_item"]').forEach(link => {
      link.addEventListener("click", function() {
        const product = products.find(p => p.id === this.dataset.productId);
        if (!product) return;

        window.dataLayer.push({
          event: "select_item",
          ecommerce: {
            item_list_name: "All Water Filters",
            items: [{
              item_id: product.id,
              item_name: product.name,
              price: product.price
            }]
          }
        });
      });
    });
  </script>
</body>
</html>
